{% extends "layout.html" %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass form-card animate-in">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="stat-icon" style="margin: 0 auto 1.5rem; width: 64px; height: 64px; border-radius: 16px;">
                <i data-lucide="lock" style="width: 32px; height: 32px;"></i>
            </div>
            <h1 class="text-gradient" style="font-size: 2rem; margin-bottom: 0.5rem;">Secure Access</h1>
            <p style="color: var(--text-secondary);">Enter your credentials to manage students.</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" name="email" required placeholder="name@institution.edu">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 1rem;">
                Sign In
                <i data-lucide="log-in" style="width: 20px;"></i>
            </button>
        </form>

        <p style="margin-top: 2rem; text-align: center; color: var(--text-secondary); font-size: 0.95rem;">
            New to SmartStudent? <a href="{{ url_for('register') }}" style="color: var(--accent-primary); font-weight: 700; text-decoration: none;">Create an account</a>
        </p>

        <div class="glass" style="margin-top: 2.5rem; padding: 1.25rem; background: rgba(56, 189, 248, 0.05); border-color: rgba(56, 189, 248, 0.2);">
            <div style="display: flex; align-items: center; gap: 0.75rem; color: var(--accent-primary); margin-bottom: 0.5rem;">
                <i data-lucide="info" style="width: 18px;"></i>
                <strong style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Demo Access</strong>
            </div>
            <p style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.4;">
                <span style="opacity: 0.7;">Email:</span> admin@example.com<br>
                <span style="opacity: 0.7;">Pass:</span> admin123
            </p>
        </div>
    </div>
</div>
{% endblock %}
