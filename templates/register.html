{% extends "layout.html" %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass form-card animate-in">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div class="stat-icon" style="margin: 0 auto 1.5rem; width: 64px; height: 64px; border-radius: 16px; background: rgba(129, 140, 248, 0.1); color: var(--accent-secondary);">
                <i data-lucide="user-plus" style="width: 32px; height: 32px;"></i>
            </div>
            <h1 class="text-gradient" style="font-size: 2rem; margin-bottom: 0.5rem;">Create Account</h1>
            <p style="color: var(--text-secondary);">Join our student analytics platform.</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Dr. John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="john@university.edu">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 1rem;">
                Register Now
                <i data-lucide="sparkles" style="width: 18px;"></i>
            </button>
        </form>

        <p style="margin-top: 2rem; text-align: center; color: var(--text-secondary); font-size: 0.95rem;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-primary); font-weight: 700; text-decoration: none;">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
